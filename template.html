<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档 - ο(=•ω＜=)ρ⌒☆</title>
    <!-- highlight.js 样式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <!-- mcfunction-highlight 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mcfunction-highlight/dist/mcfunction-highlight.min.css">
    <!-- 全局样式（与站点一致） -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 文档页专用补充样式（树形菜单、导航按钮等） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="js/minecraft.js"></script>
    <style>
        /* ---------- 树形侧边栏样式 ---------- */
        .tree-root {
            padding-left: 0;
            list-style: none;
            margin: 0;
        }
        .tree-root ul {
            padding-left: 1.5rem;
            list-style: none;
        }
        .tree-node {
            margin: 0.2rem 0;
        }
        /* 文件夹节点：可点击的标题 */
        .tree-folder > span {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            padding: 0.2rem 0;
            color: #b0b0c0;
            transition: color 0.2s;
        }
        .tree-folder > span:hover {
            color: #fff;
        }
        /* 文件夹图标：展开状态用 📂，折叠状态用 📁 */
        .tree-folder > span::before {
            content: "📂 ";
            transition: transform 0.2s;
        }
        .tree-folder.collapsed > span::before {
            content: "📁 ";
        }
        .tree-folder.collapsed > ul {
            display: none;
        }
        /* 文档链接（与 style.css 中的 .sidebar-link 保持一致） */
        .sidebar-link {
            display: block;
            padding: 0.2rem 0.5rem;
            margin: 0.1rem 0;
            border-radius: 4px;
            text-decoration: none;
            color: var(--text-muted, #99999960);
            transition: background 0.2s, color 0.2s;
            font-size: 0.88rem;
        }
        .sidebar-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .sidebar-link.active {
            background: rgba(78, 203, 113, 0.2);
            color: var(--accent, #cb4e4e);
            font-weight: 600;
        }

        /* ====== Markdown 表格样式定制 ====== */
        .doc-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.2rem 0;
            font-size: 0.95rem;
        }

        .doc-content th,
        .doc-content td {
            border: 2px solid #8a6a6a50;
            padding: 0.6rem 0.8rem;
            text-align: left;
            vertical-align: top;
        }

        .doc-content th {
            background-color: #5a3a3a80;
            color: #f0f0f0;
            font-weight: 600;
        }

        .doc-content tr:nth-child(even) {
            background-color: #3a201e0e;
        }
        .doc-content tr:nth-child(odd) {
            background-color: #4022220e;
        }

        .doc-content th {
            border-bottom: 3px solid #aa8a8a;
        }

        /* ---------- 文档内容中的导航按钮（上一章/下一章） ---------- */
        .doc-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 2.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color, #3a3a5a);
        }
        .doc-nav a {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            background: var(--bg-panel, #222240);
            color: var(--text-primary, #e0e0e0);
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid var(--border-color, #5a3a3a);
        }
        .doc-nav a:hover:not(.disabled) {
            background: var(--accent, #cb4e4e);
            color: #000;
        }
        .doc-nav a:active:not(.disabled) {
            transform: scale(0.96);
        }
        .doc-nav .disabled {
            opacity: 0.3;
            pointer-events: none;
            cursor: default;
        }

        /* ---------- 响应式兼容 ---------- */
        @media (max-width: 768px) {
            .doc-sidebar {
                height: auto !important;
                position: relative !important;
                top: 0 !important;
            }
            .doc-content {
                padding: 1.2rem !important;
            }
            .doc-nav {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .doc-nav a {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- ========== 全局导航栏 ========== -->
    <nav class="global-nav">
        <div class="nav-brand">红蘑菇hj</div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="maps.html">地图展示</a></li>
            <li><a href="mods.html">MOD 下载</a></li>
            <li><a href="collections.html" class="active">文档</a></li>
        </ul>
    </nav>

    <!-- ========== 页面布局：侧边栏 + 内容区 ========== -->
    <div class="doc-layout">
        <!-- 侧边栏 -->
        <aside class="doc-sidebar" id="doc-sidebar">
            <h3>目录</h3>
            <div id="sidebar-loading">加载目录...</div>
            <nav id="sidebar-nav"></nav>
        </aside>

        <!-- 主内容 -->
        <main class="doc-content" id="doc-content">
            <div id="content-loading">正在加载文档喵...</div>
            <div id="content-error" style="display:none; color:#e74c3c;"></div>
            <article id="content-body"></article>

            <!-- ===== 上一章/下一章导航 ===== -->
            <div class="doc-nav" id="doc-nav">
                <a href="#" class="prev disabled" id="nav-prev">← 上一章</a>
                <a href="#" class="next disabled" id="nav-next">下一章 →</a>
            </div>

            <!-- ===== Giscus 评论 ===== -->
            <div id="giscus-container" style="margin-top: 3rem; padding-top: 2rem; border-top: 2px solid var(--border-color, #3a3a5a);">
                <h3>💬 评论</h3>
                <script src="https://giscus.app/client.js"
                        data-repo="shhjtvp/The-message-board-of-my-pages"
                        data-repo-id="R_kgDOTl8dyA"
                        data-category="General"
                        data-category-id="DIC_kwDOTl8dyM4DCJnE"
                        data-mapping="url"          
                        data-strict="0"
                        data-reactions-enabled="1"
                        data-emit-metadata="0"
                        data-input-position="bottom"
                        data-theme="dark"
                        data-lang="zh-CN"
                        crossorigin="anonymous"
                        async>
                </script>
            </div>
        </main>
    </div>

    <!-- ========== 全局页脚 ========== -->
    <footer class="global-footer">
        <p>© 2026 红蘑菇hj | 基于 GitHub Pages 构建 | 文档由 marked.js 渲染</p>
    </footer>

    <!-- ========== 依赖脚本（CDN） ========== -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mcfunction-highlight/dist/mcfunction-highlight.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ---------- 工具函数 ----------
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getParam(name) {
                const params = new URLSearchParams(window.location.search);
                return params.get(name);
            }

            const pageName = getParam('page') || 'tutorial1';
            const collectionId = getParam('collection') || '';

            function getCollectionPath(subPath) {
                if (collectionId) {
                    return `docs/${collectionId}/${subPath}`;
                } else {
                    return `docs/${subPath}`;
                }
            }

            // ---------- 侧边栏加载 ----------
            async function loadSidebar(currentPage) {
                const sidebarNav = document.getElementById('sidebar-nav');
                const loadingEl = document.getElementById('sidebar-loading');

                try {
                    const indexPath = getCollectionPath('index.json');
                    const resp = await fetch(indexPath);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();

                    let tree = data.tree;
                    if (!tree && data.docs && Array.isArray(data.docs)) {
                        tree = data.docs.map(doc => ({
                            title: doc.title || doc.file,
                            file: doc.file
                        }));
                    }
                    if (!tree || !Array.isArray(tree)) {
                        throw new Error('无效的目录结构：缺少 tree 或 docs 字段');
                    }

                    const flatDocs = [];
                    function traverse(node, path) {
                        if (node.file) {
                            flatDocs.push({
                                title: node.title,
                                file: node.file,
                                path: path.concat(node.title)
                            });
                        }
                        if (node.children && Array.isArray(node.children)) {
                            node.children.forEach(child => traverse(child, path.concat(node.title)));
                        }
                    }
                    tree.forEach(root => traverse(root, []));

                    const html = buildTreeHTML(tree, currentPage);
                    sidebarNav.innerHTML = html;
                    loadingEl.style.display = 'none';

                    expandActivePath(sidebarNav, currentPage);

                    sidebarNav.querySelectorAll('.tree-folder > span').forEach(span => {
                        span.addEventListener('click', function(e) {
                            const folderNode = this.parentElement;
                            folderNode.classList.toggle('collapsed');
                            e.stopPropagation();
                        });
                    });

                    window.__flatDocs = flatDocs;

                } catch (err) {
                    loadingEl.textContent = '⚠️ 目录加载失败';
                    console.error('侧边栏加载错误:', err);
                }
            }

            function buildTreeHTML(nodes, currentPage, isRoot = true) {
                if (!nodes || nodes.length === 0) return '';
                const tag = isRoot ? 'ul' : 'ul';
                let html = `<${tag} class="tree-root">`;
                for (const node of nodes) {
                    const hasChildren = node.children && node.children.length > 0;
                    const isFile = !!node.file;
                    const liClass = hasChildren ? 'tree-node tree-folder' : 'tree-node tree-leaf';
                    const collapsedClass = hasChildren ? ' collapsed' : '';
                    html += `<li class="${liClass}${collapsedClass}">`;

                    if (hasChildren) {
                        html += `<span>${escapeHtml(node.title)}</span>`;
                        html += buildTreeHTML(node.children, currentPage, false);
                    } else if (isFile) {
                        const isActive = (node.file === currentPage + '.md' || node.file === currentPage);
                        let link = `template.html?page=${encodeURIComponent(node.file.replace(/\.md$/, ''))}`;
                        if (collectionId) {
                            link += `&collection=${encodeURIComponent(collectionId)}`;
                        }
                        html += `<a href="${link}" class="sidebar-link ${isActive ? 'active' : ''}">${escapeHtml(node.title)}</a>`;
                    } else {
                        html += `<span>${escapeHtml(node.title)}</span>`;
                    }
                    html += '</li>';
                }
                html += `</${tag}>`;
                return html;
            }

            function expandActivePath(container, currentPage) {
                const links = container.querySelectorAll('.sidebar-link');
                let activeLink = null;
                for (const link of links) {
                    if (link.classList.contains('active')) {
                        activeLink = link;
                        break;
                    }
                }
                if (!activeLink) return;

                let parent = activeLink.closest('.tree-folder');
                while (parent) {
                    parent.classList.remove('collapsed');
                    parent = parent.parentElement?.closest('.tree-folder');
                }
            }

            // ---------- 加载文档正文 ----------
            async function loadDocument(pageName) {
                const contentBody = document.getElementById('content-body');
                const loadingEl = document.getElementById('content-loading');
                const errorEl = document.getElementById('content-error');
                const navPrev = document.getElementById('nav-prev');
                const navNext = document.getElementById('nav-next');

                try {
                    const docPath = getCollectionPath(`${pageName}.md`);
                    const resp = await fetch(docPath);
                    if (!resp.ok) {
                        throw new Error(`文档 "${pageName}.md" 不存在 (HTTP ${resp.status})`);
                    }
                    let markdown = await resp.text();

                    const footnotes = {};
                    const footnoteOrder = [];
                    const processed = markdown.replace(/^\[\^([^\]]+)\]:\s*(.*)$/gm, (match, id, content) => {
                        footnotes[id] = content.trim();
                        return '';
                    });

                    let counter = 0;
                    const withRefs = processed.replace(/\[\^([^\]]+)\]/g, (match, id) => {
                        if (footnotes.hasOwnProperty(id)) {
                            counter++;
                            footnoteOrder.push(id);
                            return `<sup class="footnote-ref" data-fn-id="${id}" data-fn-num="${counter}">[${counter}]</sup>`;
                        }
                        return match;
                    });

                    const html = marked.parse(withRefs);

                    let footnoteHtml = '';
                    if (footnoteOrder.length > 0) {
                        footnoteHtml = `<div class="footnotes"><h3>脚注 Footnote</h3><ol>`;
                        for (const id of footnoteOrder) {
                            const content = footnotes[id];
                            const renderedContent = marked.parse(content);
                            footnoteHtml += `<li id="fn-${id}">${renderedContent}</li>`;
                        }
                        footnoteHtml += `</ol></div>`;
                    }

                    const finalHtml = html + footnoteHtml;
                    contentBody.innerHTML = finalHtml;
                    loadingEl.style.display = 'none';

                    if (footnoteOrder.length > 0) {
                        const refs = contentBody.querySelectorAll('.footnote-ref');
                        refs.forEach(sup => {
                            const id = sup.dataset.fnId;
                            const content = footnotes[id];
                            if (!content) return;

                            let tooltipEl = null;

                            sup.addEventListener('mouseenter', function(e) {
                                if (tooltipEl) tooltipEl.remove();

                                tooltipEl = document.createElement('div');
                                tooltipEl.className = 'footnote-tooltip';
                                tooltipEl.innerHTML = marked.parse(content);

                                const rect = this.getBoundingClientRect();
                                let top = rect.bottom + window.scrollY + 6;
                                let left = rect.left + window.scrollX;

                                const tooltipWidth = 320;
                                if (left + tooltipWidth > window.innerWidth - 10) {
                                    left = window.innerWidth - tooltipWidth - 10;
                                }
                                const tooltipHeight = tooltipEl.scrollHeight || 200;
                                if (top + tooltipHeight + 10 > window.innerHeight + window.scrollY) {
                                    top = rect.top + window.scrollY - tooltipHeight - 6;
                                }

                                tooltipEl.style.top = top + 'px';
                                tooltipEl.style.left = left + 'px';
                                document.body.appendChild(tooltipEl);
                            });

                            sup.addEventListener('mouseleave', function() {
                                if (tooltipEl) {
                                    tooltipEl.remove();
                                    tooltipEl = null;
                                }
                            });
                        });
                    }

                    const firstH1 = contentBody.querySelector('h1');
                    if (firstH1) {
                        document.title = firstH1.textContent + ' - MC 站点文档';
                    }
                    updateNavButtons(pageName);

                } catch (err) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    errorEl.textContent = '❌ ' + err.message;
                    console.error('文档加载错误:', err);
                }
            }

            function updateNavButtons(currentPage) {
                const flat = window.__flatDocs || [];
                const navPrev = document.getElementById('nav-prev');
                const navNext = document.getElementById('nav-next');

                const idx = flat.findIndex(doc => doc.file === currentPage + '.md' || doc.file === currentPage);

                if (idx === -1) {
                    navPrev.classList.add('disabled');
                    navNext.classList.add('disabled');
                    return;
                }

                if (idx > 0) {
                    const prev = flat[idx - 1];
                    let link = `template.html?page=${encodeURIComponent(prev.file.replace(/\.md$/, ''))}`;
                    if (collectionId) link += `&collection=${encodeURIComponent(collectionId)}`;
                    navPrev.href = link;
                    navPrev.textContent = `← ${prev.title}`;
                    navPrev.classList.remove('disabled');
                } else {
                    navPrev.classList.add('disabled');
                    navPrev.textContent = '← 已是第一章';
                    navPrev.href = '#';
                }

                if (idx < flat.length - 1) {
                    const next = flat[idx + 1];
                    let link = `template.html?page=${encodeURIComponent(next.file.replace(/\.md$/, ''))}`;
                    if (collectionId) link += `&collection=${encodeURIComponent(collectionId)}`;
                    navNext.href = link;
                    navNext.textContent = `${next.title} →`;
                    navNext.classList.remove('disabled');
                } else {
                    navNext.classList.add('disabled');
                    navNext.textContent = '已是最后一章 →';
                    navNext.href = '#';
                }
            }

            // ---------- 初始化 marked ----------
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang) && lang !== 'mcfunction') {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (e) {
                            console.warn('代码高亮失败:', e);
                        }
                    }
                    try {
                        return hljs.highlightAuto(code).value;
                    } catch (e) {
                        return code;
                    }
                }
            });

            // ---------- 启动 ----------
            loadSidebar(pageName);
            loadDocument(pageName);

            window.addEventListener('DOMContentLoaded', () => {
                if (typeof MCFunctionHighlight !== 'undefined') {
                    MCFunctionHighlight.init({ autoUpdate: true });
                }
            });

        })();
    </script>
</body>
