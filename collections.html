    <!-- ========== 页面内容 ========== -->
    <main class="main-content">
        <div class="page-head">
            <h1>文档集合</h1>
            <p>选择一个文档集，开始阅读</p>
        </div>

        <!-- 卡片由下面的脚本读取 docs/collections.json 生成 -->
        <div id="collection-grid" class="collection-grid">
            <p class="status-line">⏳ 加载集合列表…</p>
        </div>
    </main>

    <!-- ========== 全局页脚 ========== -->
    <footer class="global-footer">

    </footer>

    <script src="js/cursor.js"></script>
    <script src="js/nav.js"></script>
    <script>
        (function () {
            'use strict';

            const grid = document.getElementById('collection-grid');

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function showStatus(text, isError) {
                grid.innerHTML = `<p class="status-line${isError ? ' is-error' : ''}">`
                    + escapeHtml(text) + '</p>';
            }

            async function loadCollections() {
                try {
                    const resp = await fetch('docs/collections.json');
                    if (!resp.ok) {
                        throw new Error(`无法加载集合注册表（HTTP ${resp.status}）`);
                    }
                    const list = await resp.json();

                    if (!Array.isArray(list) || list.length === 0) {
                        showStatus('⚠️ 暂无可用文档集，请检查 docs/collections.json', true);
                        return;
                    }

                    const cards = [];
                    for (const coll of list) {
                        const { id, title, description, entry } = coll;
                        if (!id || !title) {
                            console.warn('集合配置缺少 id 或 title，已跳过:', coll);
                            continue;
                        }
                        // entry 为空时模板页会回退到默认文档
                        const link = 'template.html?collection=' + encodeURIComponent(id)
                            + '&page=' + encodeURIComponent(entry || '');
                        cards.push(
                            '<a class="collection-card" href="' + link + '">'
                            + '<h2>' + escapeHtml(title) + '</h2>'
                            + '<p>' + escapeHtml(description || '') + '</p>'
                            + '<span class="collection-card__enter">进入阅读</span>'
                            + '</a>'
                        );
                    }

                    if (!cards.length) {
                        showStatus('⚠️ 文档集配置不完整（缺少 id 或 title）', true);
                        return;
                    }
                    grid.innerHTML = cards.join('');
                } catch (err) {
                    console.error('集合加载错误:', err);
                    showStatus('❌ 加载失败：' + err.message, true);
                }
            }

            loadCollections();
        })();
    </script>
</body>
